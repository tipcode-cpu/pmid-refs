<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레퍼런스">
<title>레퍼런스</title>
<style>
  :root {
    --bg:#0f1115; --card:#191d24; --card2:#21262f; --line:#2c323d;
    --text:#e8ecf2; --dim:#8b95a5; --accent:#f0b429; --danger:#e5644e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  }
  main { max-width:720px; margin:0 auto; padding:18px 14px 60px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  h1 { font-size:19px; margin:0; letter-spacing:-.02em; white-space:nowrap; }
  .grow { flex:1; }

  select, textarea, input[type=text] {
    background:var(--card); color:var(--text);
    border:1px solid var(--line); border-radius:11px;
    padding:10px 12px; font:inherit; outline:none; width:100%;
  }
  select:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:64px; font-size:15px; }

  button {
    background:var(--card2); color:var(--text);
    border:1px solid var(--line); border-radius:11px;
    padding:10px 14px; font:500 14px inherit; cursor:pointer; white-space:nowrap;
  }
  button:active { background:var(--line); }
  button.primary { background:var(--accent); color:#1a1305; border-color:var(--accent); font-weight:600; }
  button.ghost { background:none; border:none; color:var(--dim); padding:6px 8px; font-size:13px; }
  button.ghost:hover { color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }

  .bar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar > select { width:auto; flex:1; min-width:140px; }

  #status { font-size:13px; color:var(--dim); min-height:20px; margin:8px 0; }
  #status.err { color:var(--danger); }

  .ref {
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:12px 14px; margin-bottom:9px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .num { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; padding-top:2px; min-width:20px; }
  .body { flex:1; min-width:0; }
  .cite { font-weight:600; letter-spacing:-.01em; }
  .cite .pmid { color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap; }
  .cite .pmid:hover { text-decoration:underline; }
  .title { font-size:13.5px; color:var(--dim); margin-top:4px; }
  .ids { margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; }
  .ids a { color:var(--accent); text-decoration:none; }
  .ids a:hover { text-decoration:underline; }
  .ids span { color:var(--dim); }

  .cand-hd { color:var(--dim); font-size:13px; margin:2px 0 6px; }
  .qr { display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; }
  .qr img { width:92px; height:92px; border-radius:6px; background:#fff; display:block; image-rendering:pixelated; }
  .qr-btns { display:flex; flex-wrap:wrap; justify-content:center; gap:0; max-width:136px; }
  .qr-btns > * { font-size:12px; padding:5px 3px; }
  .qr-btns a { color:var(--dim); text-decoration:none; white-space:nowrap; }
  .qr-btns a:hover { color:var(--text); }
  .acts { display:flex; flex-direction:column; gap:4px; }

  /* 폰 폭에서는 QR·버튼 칼럼을 제목 아래로 내린다 */
  @media (max-width:520px) {
    .ref { flex-wrap:wrap; }
    .body { min-width:62%; }
    .qr { margin-left:30px; }
  }

  #empty { color:var(--dim); text-align:center; padding:40px 10px; font-size:14px; line-height:1.8; }
  footer { margin-top:22px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>레퍼런스</h1>
    <span class="grow"></span>
    <span id="count" style="font-size:13px;color:var(--dim)"></span>
  </header>

  <div class="bar">
    <select id="group"></select>
    <button id="newGroup">+ 발표</button>
    <button id="renameGroup" class="ghost">이름</button>
    <button id="delGroup" class="ghost">삭제</button>
  </div>

  <textarea id="input" placeholder="PMID · DOI · PMCID 붙여넣기 — 여러 개는 줄바꿈이나 쉼표로. 번호를 모르면 저자·저널·연도(예: Guan WJ N Engl J Med 2020 coronavirus)로 검색됩니다."></textarea>
  <div class="bar" style="margin-top:8px">
    <button id="add" class="primary grow">추가</button>
    <select id="fmt" style="flex:0 0 auto;width:auto">
      <option value="short">간단</option>
      <option value="vancouver">Vancouver</option>
      <option value="authoryear">저자-연도</option>
    </select>
    <button id="copy">복사</button>
  </div>

  <div id="status"></div>
  <div id="cands"></div>
  <div id="list"></div>
  <div id="empty" hidden></div>

  <footer>
    <button class="ghost" id="enw">EndNote 내보내기</button>
    <button class="ghost" id="export">백업(JSON)</button>
    <button class="ghost" id="importBtn">불러오기</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>

<script src="qrcode.js"></script>
<script>
const KEY = 'pmidrefs';
const API = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi';
const SEARCH = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi';
const DOI_RE = /10\.\d{4,9}\/[^\s,;"'<>]+/g;
const PMC_RE = /PMC\d{5,9}/gi;

let db = load();

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.refs && d.groups && d.groups.length) return d;
  } catch (e) {}
  return { refs: {}, groups: [{ id: 'g1', name: '기본', pmids: [] }], current: 'g1' };
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function group() { return db.groups.find(g => g.id === db.current) || db.groups[0]; }

// ── 인용 포맷 ───────────────────────────────────────────
function authorList(r) { return r.authors || []; }

// 저자 · 저널 · 연도 — 카드 첫 줄과 간단 포맷이 같은 함수를 쓴다.
function head(r) {
  const a = authorList(r);
  return `${a[0] || ''}${a.length > 1 ? ' et al' : ''}. ${r.journal} ${r.year}`;
}

// 카드 첫 줄 그대로 — 낱개 복사 버튼이 내주는 문자열
function line(r) { return `${head(r)} PMID ${r.pmid}`; }

function cite(r, fmt) {
  const a = authorList(r);
  const first = a[0] || '';
  const etal = a.length > 1 ? ' et al' : '';
  if (fmt === 'short') {
    return `${head(r)} PMID ${r.pmid}${r.doi ? '. doi:' + r.doi : ''}`;
  }
  if (fmt === 'authoryear') {
    return `${first}${etal} (${r.year}) ${r.title} ${r.journal}.${r.doi ? ' doi:' + r.doi : ''}`;
  }
  // vancouver
  const names = a.length > 6 ? a.slice(0, 6).join(', ') + ', et al' : a.join(', ');
  let loc = r.volume || '';
  if (r.issue) loc += `(${r.issue})`;
  if (r.pages) loc += `:${r.pages}`;
  return `${names}. ${r.title} ${r.journal}. ${r.year}${loc ? ';' + loc : ''}.` +
         ` PMID: ${r.pmid}${r.doi ? '. doi: ' + r.doi : ''}`;
}

// ── QR ─────────────────────────────────────────────────
function pubmedUrl(pmid) { return `https://pubmed.ncbi.nlm.nih.gov/${pmid}/`; }

function qrCanvas(text, scale, margin) {
  const q = qrcode(0, 'M');       // 0 = 자동 버전, M = 25% 오류정정
  q.addData(text); q.make();
  const n = q.getModuleCount(), size = (n + margin * 2) * scale;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (q.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
  return cv;
}

// toDataURL은 동기 — toBlob을 await하면 사파리가 제스처 만료로 보고 거부하고,
// ClipboardItem에 Promise를 넘기면 크롬이 제스처 없을 때 응답하지 않는다.
function pngBlob(cv) {
  const bin = atob(cv.toDataURL('image/png').split(',')[1]);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: 'image/png' });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function copyQR(pmid) {
  const blob = pngBlob(qrCanvas(pubmedUrl(pmid), 12, 4));   // 슬라이드용 고해상도
  const write = (typeof ClipboardItem !== 'undefined' && navigator.clipboard && navigator.clipboard.write)
    ? navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
    : Promise.reject(new Error('클립보드 미지원'));

  write.then(() => status(`PMID ${pmid} QR을 복사했습니다. 슬라이드에 붙여넣으세요.`))
       .catch(() => {
         download(blob, `qr-${pmid}.png`);
         status('클립보드를 쓸 수 없습니다. PNG로 내려받았고, QR을 길게 눌러 복사해도 됩니다.', true);
       });
}

// ── EndNote (.enw) ─────────────────────────────────────
// EndNote import 포맷 — %0로 시작하고 레코드 사이는 빈 줄.
function enw(r) {
  const L = ['%0 Journal Article'];
  (r.authors || []).forEach(a => {
    const m = a.trim().match(/^(.+?)\s+([A-Za-z]{1,3})$/);   // "Park S" → "Park, S" (성을 제대로 잡게)
    // 개인 저자가 아니면 단체 저자 — EndNote는 끝에 쉼표가 있어야 단체명으로 읽는다
    L.push('%A ' + (m ? `${m[1]}, ${m[2]}` : a + ','));
  });
  L.push('%T ' + String(r.title || '').replace(/\.$/, ''));
  if (r.journal) L.push('%J ' + r.journal);
  if (r.year) L.push('%D ' + r.year);
  if (r.volume) L.push('%V ' + r.volume);
  if (r.issue) L.push('%N ' + r.issue);
  if (r.pages) L.push('%P ' + r.pages);
  L.push('%M ' + r.pmid);
  if (r.doi) L.push('%R ' + r.doi);
  L.push('%U ' + pubmedUrl(r.pmid));
  return L.join('\r\n');   // EndNote(윈도우)는 CRLF가 안전
}

// ── 렌더 ────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function render() {
  const g = group();
  $('group').innerHTML = db.groups
    .map(x => `<option value="${x.id}"${x.id === g.id ? ' selected' : ''}>${esc(x.name)} (${x.pmids.length})</option>`)
    .join('');
  $('count').textContent = `전체 ${Object.keys(db.refs).length}편`;

  const list = $('list');
  list.innerHTML = '';
  g.pmids.forEach((pmid, i) => {
    const r = db.refs[pmid];
    if (!r) return;
    const el = document.createElement('div');
    el.className = 'ref';
    el.innerHTML =
      `<div class="num">${i + 1}</div>` +
      `<div class="body">` +
        `<div class="cite">${esc(head(r))} ` +
          `<a class="pmid" href="https://pubmed.ncbi.nlm.nih.gov/${r.pmid}/" target="_blank" rel="noopener">PMID ${r.pmid}</a>` +
        `</div>` +
        `<div class="title">${esc(r.title)}</div>` +
        `<div class="ids">` +
          (r.doi ? `<a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">doi:${esc(r.doi)}</a>`
                 : `<span>doi 없음</span>`) +
          (r.volume ? `<span>${esc(r.volume)}${r.issue ? '(' + esc(r.issue) + ')' : ''}${r.pages ? ':' + esc(r.pages) : ''}</span>` : ``) +
        `</div>` +
      `</div>` +
      `<div class="qr">` +
        `<img src="${qrCanvas(pubmedUrl(r.pmid), 4, 2).toDataURL()}" alt="PMID ${r.pmid} PubMed QR" width="92" height="92">` +
        `<div class="qr-btns">` +
          `<button class="ghost" data-qr="${r.pmid}">QR 복사</button>` +
          `<a href="${pubmedUrl(r.pmid)}" target="_blank" rel="noopener" title="PubMed에서 열기">PubMed ↗</a>` +
        `</div>` +
      `</div>` +
      `<div class="acts">` +
        `<button class="ghost" data-copy="${r.pmid}" title="첫 줄 복사">복사</button>` +
        `<button class="ghost" data-copyt="${r.pmid}" title="제목 복사">제목</button>` +
        `<button class="ghost" data-del="${r.pmid}" title="이 발표에서 빼기">✕</button>` +
      `</div>`;
    list.appendChild(el);
  });

  $('empty').hidden = g.pmids.length > 0;
  $('empty').innerHTML = 'PMID · DOI · PMCID를 붙여넣고 추가를 누르세요.<br>발표별로 나눠 담고, 복사 버튼으로 한꺼번에 가져갑니다.';
}

function renderCands(ids) {
  const el = $('cands');
  if (!ids.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="cand-hd">이 중에 맞는 것을 담으세요</div>` + ids.map(id => {
    const r = cands[id];
    return `<div class="ref">` +
      `<div class="body">` +
        `<div class="cite">${esc(head(r))} ` +
          `<a class="pmid" href="${pubmedUrl(r.pmid)}" target="_blank" rel="noopener">PMID ${r.pmid}</a>` +
        `</div>` +
        `<div class="title">${esc(r.title)}</div>` +
      `</div>` +
      `<div class="acts"><button class="ghost" data-take="${r.pmid}" title="이 발표에 담기">담기</button></div>` +
    `</div>`;
  }).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function status(msg, isErr) {
  $('status').textContent = msg || '';
  $('status').className = isErr ? 'err' : '';
}

// ── PMID 수집 ───────────────────────────────────────────
// DOI·PMCID를 먼저 걷어낸 뒤 남은 숫자만 PMID로 본다.
// (DOI 안의 숫자가 PMID로 오인되던 문제도 여기서 막힌다)
function parseIds(raw) {
  let t = String(raw || '');
  const dois = (t.match(DOI_RE) || []).map(d => d.replace(/[.,;:)\]\/]+$/, ''));
  t = t.replace(DOI_RE, ' ');
  const pmcids = (t.match(PMC_RE) || []).map(x => x.toUpperCase());
  t = t.replace(PMC_RE, ' ');
  const pmids = [...new Set(t.match(/\d{6,9}/g) || [])];
  return {
    pmids,
    others: [...new Set([...dois, ...pmcids])],
    // 식별자를 다 걷어내고 남은 글 — 저자·저널·연도 검색어로 쓴다
    rest: t.replace(/\d{6,9}/g, ' ').replace(/\s+/g, ' ').trim()
  };
}

// PMID 목록 → 서지정보. 저장·담기 같은 부수효과는 없다.
async function summaries(ids) {
  const res = await fetch(`${API}?db=pubmed&retmode=json&tool=pmid-refs&id=${ids.join(',')}`);
  const r = (await res.json()).result;
  if (!r) throw new Error('응답 형식 오류');
  const out = {}, failed = [];
  for (const id of ids) {
    const d = r[id];
    if (!d || d.error || !d.uid) { failed.push(id); continue; }
    out[id] = {
      pmid: id,
      title: (d.title || '').replace(/\.$/, '') + '.',
      authors: (d.authors || []).map(a => a.name).filter(Boolean),
      journal: d.source || '',
      year: (d.pubdate || '').slice(0, 4),
      volume: d.volume || '', issue: d.issue || '', pages: d.pages || '',
      doi: (d.articleids || []).filter(x => x.idtype === 'doi').map(x => x.value)[0] || ''
    };
  }
  return { refs: out, failed };
}

// 식별자가 없을 때 — 저자·저널·연도 같은 글로 PubMed를 검색해 후보를 보여준다.
// 어느 논문인지는 사람이 고른다 (엉뚱한 걸 말없이 담지 않는다).
let cands = {};

// "Butler et al., Circulation 2025;151:1111-1125, Figure 1." 같은 인용 문자열은
// 그대로 넘기면 0건이 나온다 (et al.·Figure·페이지범위가 전부 AND로 걸린다).
// 알아본 조각만 필드 질의로 바꾸고, 안 나오면 조건을 하나씩 풀어 넓힌다.
function citationTerms(raw) {
  const t = String(raw)
    .replace(/\bet al\.?/gi, ' ')
    .replace(/\bfigs?\.?\s*\d+[a-z]?/gi, ' ')
    .replace(/\bfigure\s*\d+[a-z]?/gi, ' ')
    .replace(/\bsuppl\w*\.?/gi, ' ')
    .replace(/\s+/g, ' ').trim();

  const year = (t.match(/\b(?:19|20)\d{2}\b/) || [])[0];
  const vol = (t.match(/[;,]\s*(\d{1,4})\s*[:(]/) || [])[1];
  const page = (t.match(/:\s*(\d{1,6})/) || [])[1];

  // 권·페이지 표기(2025;151:1111)가 있어야 인용 문자열로 본다.
  // 그냥 "저자 저널 연도 키워드"로 적은 건 자유 검색이 더 잘 듣는다.
  if (!year || !(vol || page)) return [t];

  const words = t.slice(0, t.indexOf(year)).replace(/[.,;:]/g, ' ').split(/\s+/).filter(Boolean);
  let author = words[0] || '';
  let rest = words.slice(1);
  if (rest[0] && /^[A-Z]{1,3}$/.test(rest[0])) { author += ' ' + rest[0]; rest = rest.slice(1); }  // "Butler J"
  const journal = rest.join(' ');

  const f = [];
  if (author) f.push(`${author}[au]`);
  if (journal) f.push(`${journal}[ta]`);
  f.push(`${year}[dp]`);

  const terms = [];
  if (vol && page) terms.push([...f, `${vol}[vi]`, `${page}[pg]`].join(' AND '));
  if (vol) terms.push([...f, `${vol}[vi]`].join(' AND '));
  terms.push(f.join(' AND '));
  return terms;
}

async function searchCitation(q) {
  status(`PubMed 검색 중 — "${q}"`);
  try {
    let ids = [];
    for (const term of citationTerms(q)) {
      const res = await fetch(`${SEARCH}?db=pubmed&retmode=json&retmax=8&sort=relevance&tool=pmid-refs&term=${encodeURIComponent(term)}`);
      ids = ((await res.json()).esearchresult || {}).idlist || [];
      if (ids.length) break;
    }
    if (!ids.length) return status('검색 결과가 없습니다. 저자·저널·연도를 다시 확인해 보세요.', true);
    cands = (await summaries(ids)).refs;
    const found = Object.keys(cands);
    // 한 건뿐이면 고를 게 없다 — 바로 담고 무엇을 담았는지 알려준다
    if (found.length === 1) return take(found[0]);
    renderCands(found);
    status(`후보 ${found.length}건 — 맞는 것을 담으세요.`);
  } catch (e) {
    status('PubMed 연결 실패 — 인터넷을 확인하세요. (' + e.message + ')', true);
  }
}

async function addPmids(raw) {
  const parsed = parseIds(raw);
  let ids = parsed.pmids;
  let miss = 0;

  // DOI·PMCID는 esearch로 PMID를 찾는다 (한 번의 OR 질의)
  if (parsed.others.length) {
    status(`DOI·PMCID ${parsed.others.length}건 조회 중…`);
    const term = parsed.others.map(o => o.toUpperCase().startsWith('PMC') ? `${o}[pmcid]` : `${o}[doi]`).join(' OR ');
    try {
      const res = await fetch(`${SEARCH}?db=pubmed&retmode=json&retmax=200&tool=pmid-refs&term=${encodeURIComponent(term)}`);
      const found = ((await res.json()).esearchresult || {}).idlist || [];
      ids = [...new Set([...ids, ...found])];
      miss = parsed.others.length - found.length;
    } catch (e) {
      return status('PubMed 연결 실패 — 인터넷을 확인하세요. (' + e.message + ')', true);
    }
  }

  if (!ids.length) {
    if (parsed.rest.length >= 3) return searchCitation(parsed.rest);
    return status('PMID·DOI·PMCID를 찾지 못했습니다.', true);
  }
  renderCands([]);

  const g = group();
  const known = ids.filter(id => db.refs[id]);
  const need = ids.filter(id => !db.refs[id]);

  // 이미 받아둔 건 네트워크 없이 바로 담기
  known.forEach(id => { if (!g.pmids.includes(id)) g.pmids.push(id); });

  if (need.length) {
    status(`PubMed에서 ${need.length}편 불러오는 중…`);
    try {
      const { refs, failed } = await summaries(need);
      for (const id of Object.keys(refs)) {
        db.refs[id] = refs[id];
        if (!g.pmids.includes(id)) g.pmids.push(id);
      }
      status(failed.length
        ? `${need.length - failed.length}편 추가. 실패: ${failed.join(', ')}`
        : `${need.length}편 추가.`, failed.length > 0);
    } catch (e) {
      return status('PubMed 연결 실패 — 인터넷을 확인하세요. (' + e.message + ')', true);
    }
  } else {
    status(`${known.length}편 추가 (이미 받아둔 자료).`);
  }

  if (miss > 0) status($('status').textContent + ` / DOI·PMCID ${miss}건은 PubMed에 없습니다.`, true);

  save(); render();
  $('input').value = '';
}

// ── 이벤트 ──────────────────────────────────────────────
$('add').addEventListener('click', () => addPmids($('input').value));
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addPmids($('input').value);
});

$('group').addEventListener('change', e => { db.current = e.target.value; save(); render(); });

$('newGroup').addEventListener('click', () => {
  const name = prompt('발표 이름');
  if (!name) return;
  const id = 'g' + Date.now();
  db.groups.push({ id, name, pmids: [] });
  db.current = id;
  save(); render();
});

$('renameGroup').addEventListener('click', () => {
  const g = group();
  const name = prompt('발표 이름', g.name);
  if (!name) return;
  g.name = name; save(); render();
});

$('delGroup').addEventListener('click', () => {
  if (db.groups.length < 2) return status('마지막 발표는 지울 수 없습니다.', true);
  const g = group();
  if (!confirm(`"${g.name}" 발표를 지웁니다. 논문 자료 자체는 남습니다.`)) return;
  db.groups = db.groups.filter(x => x.id !== g.id);
  db.current = db.groups[0].id;
  save(); render();
});

function take(id) {
  const g = group();
  db.refs[id] = db.refs[id] || cands[id];
  if (!g.pmids.includes(id)) g.pmids.push(id);
  save(); renderCands([]); render();
  status(`${line(db.refs[id])} — 담았습니다.`);
  $('input').value = '';
}

$('cands').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.dataset.take) take(b.dataset.take);
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.qr) return copyQR(b.dataset.qr);
  if (b.dataset.copy) return copyText(line(db.refs[b.dataset.copy]), '첫 줄 복사했습니다.');
  if (b.dataset.copyt) return copyText(db.refs[b.dataset.copyt].title, '제목 복사했습니다.');
  const pmid = b.dataset.del;
  if (!pmid) return;
  const g = group();
  g.pmids = g.pmids.filter(x => x !== pmid);
  save(); render();
});

async function copyText(text, ok) {
  try {
    await navigator.clipboard.writeText(text);
    status(ok);
  } catch (e) {
    $('input').value = text;
    status('클립보드 권한이 없어 위 칸에 넣었습니다. 직접 복사하세요.', true);
  }
}

$('copy').addEventListener('click', () => {
  const g = group(), fmt = $('fmt').value;
  if (!g.pmids.length) return status('복사할 항목이 없습니다.', true);
  const text = g.pmids.map((p, i) => `${i + 1}. ${cite(db.refs[p], fmt)}`).join('\n');
  copyText(text, `${g.pmids.length}편 복사했습니다.`);
});

$('enw').addEventListener('click', () => {
  const g = group();
  if (!g.pmids.length) return status('내보낼 항목이 없습니다.', true);
  const text = g.pmids.map(p => enw(db.refs[p])).join('\r\n\r\n') + '\r\n\r\n';
  // EndNote는 UTF-8 BOM이 있어야 한글·특수문자를 제대로 읽는다
  download(new Blob(['\uFEFF' + text], { type: 'application/x-endnote-refer;charset=utf-8' }),
           (g.name.replace(/[\\\/:*?"<>|]/g, '_') || 'refs') + '.enw');
  status(`${g.pmids.length}편을 .enw로 내보냈습니다. EndNote에서 File > Import로 여세요.`);
});

$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'refs-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.refs || !d.groups) throw new Error('형식이 다릅니다');
    // 병합 — 기존 것을 지우지 않음
    Object.assign(db.refs, d.refs);
    for (const g of d.groups) {
      const mine = db.groups.find(x => x.name === g.name);
      if (mine) g.pmids.forEach(p => { if (!mine.pmids.includes(p)) mine.pmids.push(p); });
      else db.groups.push({ id: 'g' + Date.now() + Math.floor(performance.now()), name: g.name, pmids: g.pmids });
    }
    save(); render();
    status('불러오기 완료 (기존 자료와 합쳤습니다).');
  } catch (err) {
    status('불러오기 실패: ' + err.message, true);
  }
  e.target.value = '';
});

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// #test 로 열면 포맷 로직 자체 점검
if (location.hash === '#test') {
  const r = { pmid: '37189276', title: 'Some title.', authors: ['Park S', 'Kim J'],
              journal: 'Epidemiol Health', year: '2023', volume: '45', issue: '', pages: 'e2023045',
              doi: '10.4178/epih.e2023045' };
  console.assert(cite(r, 'short') === 'Park S et al. Epidemiol Health 2023 PMID 37189276. doi:10.4178/epih.e2023045', 'short', cite(r, 'short'));
  console.assert(head(r) === 'Park S et al. Epidemiol Health 2023', '첫 줄', head(r));
  console.assert(line(r) === 'Park S et al. Epidemiol Health 2023 PMID 37189276', '낱개 복사 줄', line(r));
  const ct = citationTerms('Butler et al., Circulation 2025;151:1111-1125, Figure 1.');
  console.assert(ct[0] === 'Butler[au] AND Circulation[ta] AND 2025[dp] AND 151[vi] AND 1111[pg]', '인용 문자열 파싱', ct[0]);
  console.assert(ct.length === 3 && ct[2] === 'Butler[au] AND Circulation[ta] AND 2025[dp]', '조건을 풀어가며 넓힌다', ct);
  const free = citationTerms('Guan WJ N Engl J Med 2020 clinical characteristics');
  console.assert(free.length === 1 && free[0].indexOf('[au]') < 0, '권·페이지 없으면 자유 검색 그대로', free);
  const q = parseIds('Guan WJ N Engl J Med 2020 coronavirus');
  console.assert(!q.pmids.length && !q.others.length, '검색어에는 식별자가 없다', q);
  console.assert(q.rest === 'Guan WJ N Engl J Med 2020 coronavirus', '검색어 그대로 남는다', q.rest);
  console.assert(parseIds('37189276').rest === '', 'PMID만 있으면 검색어 없음', parseIds('37189276').rest);
  const p = parseIds('https://doi.org/10.4178/epih.e2023045  PMC1234567, 37189276');
  console.assert(p.pmids.join() === '37189276', 'DOI 속 숫자를 PMID로 오인하지 않음', p.pmids);
  console.assert(p.others.join() === '10.4178/epih.e2023045,PMC1234567', 'DOI·PMCID 추출', p.others);
  console.assert(cite(r, 'vancouver').includes('2023;45:e2023045.'), 'vancouver', cite(r, 'vancouver'));
  const solo = Object.assign({}, r, { authors: ['Park S'] });
  console.assert(cite(solo, 'short').startsWith('Park S. '), '단독저자 et al 없음', cite(solo, 'short'));
  console.assert(!cite(Object.assign({}, r, { doi: '' }), 'short').includes('doi'), 'doi 없을 때', '');
  const cv = qrCanvas(pubmedUrl('37189276'), 3, 2);
  console.assert(cv.width === cv.height && cv.width >= (21 + 4) * 3, 'QR 캔버스 크기', cv.width);
  console.assert(pubmedUrl('37189276') === 'https://pubmed.ncbi.nlm.nih.gov/37189276/', 'pubmed url');
  const b = pngBlob(cv);
  console.assert(b.type === 'image/png' && b.size > 100, 'PNG blob 동기 생성', b.size);
  const e = enw(r).split('\r\n');
  console.assert(e[0] === '%0 Journal Article', 'enw 첫 줄', e[0]);
  console.assert(e.includes('%A Park, S') && e.includes('%A Kim, J'), 'enw 저자 성,이름', e.join('|'));
  console.assert(e.includes('%M 37189276') && e.includes('%R 10.4178/epih.e2023045'), 'enw PMID/DOI', e.join('|'));
  console.assert(e.includes('%T Some title'), 'enw 제목 끝점 제거', e.join('|'));
  console.log('self-check 완료');
}
